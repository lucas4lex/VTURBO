<svg
    xmlns="http://www.w3.org/2000/svg"
    width="1200"
    height="630"
    viewBox="0 0 1200 630"
>

    <defs>

        <linearGradient
            id="bg"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0" stop-color="#000000"/>
            <stop offset=".65" stop-color="#050b17"/>
            <stop offset="1" stop-color="#071b35"/>
        </linearGradient>

        <linearGradient
            id="blue"
            x1="0"
            y1="0"
            x2="1"
            y2="1"
        >
            <stop offset="0" stop-color="#1769ff"/>
            <stop offset="1" stop-color="#43d9ff"/>
        </linearGradient>

        <filter id="blur">
            <feGaussianBlur stdDeviation="60"/>
        </filter>

    </defs>


    <rect
        width="1200"
        height="630"
        fill="url(#bg)"
    />


    <circle
        cx="970"
        cy="90"
        r="220"
        fill="#1769ff"
        opacity=".16"
        filter="url(#blur)"
    />


    <circle
        cx="180"
        cy="560"
        r="180"
        fill="#43d9ff"
        opacity=".07"
        filter="url(#blur)"
    />


    <rect
        x="80"
        y="95"
        width="80"
        height="80"
        rx="20"
        fill="url(#blue)"
    />


    <path
        d="M99 113h42v12h-15v34h-12v-34H99z"
        fill="#fff"
    />


    <text
        x="185"
        y="151"
        font-family="Arial, Helvetica, sans-serif"
        font-size="47"
        font-weight="900"
        fill="#fff"
    >
        VTURBO
    </text>


    <text
        x="80"
        y="290"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="900"
        fill="#fff"
    >
        Sua marca.
    </text>


    <text
        x="80"
        y="365"
        font-family="Arial, Helvetica, sans-serif"
        font-size="68"
        font-weight="900"
        fill="#fff"
    >
        Sua presença.
    </text>


    <text
        x="80"
        y="430"
        font-family="Arial, Helvetica, sans-serif"
        font-size="24"
        fill="#929292"
    >
        Card Digital · Landing Pages · Sites Premium
    </text>


    <rect
        x="875"
        y="225"
        width="220"
        height="315"
        rx="27"
        fill="#0d0d0d"
        stroke="#292929"
    />


    <circle
        cx="985"
        cy="285"
        r="39"
        fill="url(#blue)"
    />


    <text
        x="985"
        y="298"
        text-anchor="middle"
        font-family="Arial"
        font-size="29"
        font-weight="900"
        fill="#fff"
    >
        V
    </text>


    <rect
        x="915"
        y="350"
        width="140"
        height="30"
        rx="7"
        fill="#1769ff"
    />


    <rect
        x="915"
        y="392"
        width="140"
        height="25"
        rx="7"
        fill="#171717"
    />


    <rect
        x="915"
        y="429"
        width="140"
        height="25"
        rx="7"
        fill="#171717"
    />

</svg>